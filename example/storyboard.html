<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>App Storyboard</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:oklch(97.5% .006 85);--sheet:oklch(99% .004 85);--ink:oklch(24% .012 260);--soft:oklch(46% .012 260);--rule:oklch(87% .008 85);--hair:oklch(92% .007 85);
  --sel:oklch(46% .13 255);--sel-bg:oklch(93% .03 255);--flag:oklch(52% .17 32);--flag-bg:oklch(94% .035 32);--amber:oklch(58% .12 75);--amber-bg:oklch(94% .04 85);
  --read:oklch(93% .03 240);--reshape:oklch(93% .004 260);--combine:oklch(92% .045 85);--reduce:oklch(92% .04 160);
  --read-t:oklch(40% .1 245);--reshape-t:oklch(40% .01 260);--combine-t:oklch(42% .09 75);--reduce-t:oklch(38% .08 160);
  --bar:oklch(74% .012 260);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:oklch(19% .008 260);--sheet:oklch(22% .008 260);--ink:oklch(92% .006 85);--soft:oklch(72% .008 85);--rule:oklch(34% .008 260);--hair:oklch(28% .008 260);
  --sel:oklch(76% .11 255);--sel-bg:oklch(32% .05 255);--flag:oklch(72% .15 32);--flag-bg:oklch(31% .06 32);--amber:oklch(78% .12 80);--amber-bg:oklch(32% .05 80);
  --read:oklch(32% .05 245);--reshape:oklch(31% .006 260);--combine:oklch(33% .05 80);--reduce:oklch(32% .045 160);
  --read-t:oklch(84% .07 245);--reshape-t:oklch(82% .006 260);--combine-t:oklch(85% .08 80);--reduce-t:oklch(84% .07 160);
  --bar:oklch(50% .012 260);
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 "Instrument Sans",-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
code,.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:.88em}
button{font:inherit;color:inherit;background:none;border:1px solid var(--rule);border-radius:4px;padding:3px 9px;cursor:pointer}
button:hover{border-color:var(--ink)}button.on{background:var(--sel-bg);border-color:var(--sel)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.title{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;padding:16px 24px 12px;border-bottom:2px solid var(--ink)}
.title h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-.01em}
.title .sub{color:var(--soft)}
.title .ask{margin-left:auto}
.title input{font:inherit;font-size:14px;padding:4px 10px;width:330px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);color:var(--ink)}
.tier{border-bottom:2px solid var(--ink)}
.tierhead{display:flex;align-items:baseline;gap:12px;padding:10px 24px;border-bottom:1px solid var(--rule);position:sticky;left:0}
.tierhead b{font-size:13px;letter-spacing:.09em;text-transform:uppercase}
.tierhead i{font-style:normal;font-weight:700;width:20px}
.tierhead span{color:var(--soft)}
/* A: structure */
#structure{overflow-x:auto}
.lanes{display:flex;align-items:stretch;position:relative;min-width:max-content}
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.lane{padding:14px 20px 20px;border-right:1px solid var(--rule)}
.lane:last-child{border-right:0;flex:1}
.lane>h2{font-size:13px;margin:0 0 10px;color:var(--soft);font-weight:500;min-height:26px}.lane>h2 button{font-size:12.5px;padding:1px 8px}.lane[hidden]{display:none}
.mock{position:relative;width:540px;line-height:0;border:1px solid var(--rule)}
.mock img{width:100%;display:block}
.rg{position:absolute;border:1.5px solid transparent;cursor:pointer;background:transparent;padding:0;border-radius:3px;transition:background-color .12s,border-color .12s}
.rg:hover{background:color-mix(in oklch,var(--sel) 12%,transparent);border-color:var(--sel)}
.rg.quiet{border-color:color-mix(in oklch,var(--sel) 35%,transparent)}
.rg.active{border:2.5px solid var(--sel);background:color-mix(in oklch,var(--sel) 14%,transparent)}
.rg.unbuilt{border:1.5px dashed var(--flag)}
#off{margin-top:10px;width:540px}
#off button{display:block;width:100%;text-align:left;margin-top:6px;font-size:14px}
#off button.active{background:var(--sel-bg);border-color:var(--sel)}
.path{display:flex;gap:18px;align-items:flex-start}
.ep{width:560px}
.ephead{display:flex;align-items:center;gap:8px;padding:6px 0 7px;border-bottom:1.5px solid var(--ink);cursor:pointer}
.ephead .p{font-weight:500;font-size:14.5px;flex:1}
.ephead .ct{color:var(--soft);font-size:13.5px}
.ephead button{font-size:13px;padding:1px 8px}
.ep.closed .ephead{border-bottom-color:var(--rule)}
.grouplabel{font-size:12.5px;color:var(--soft);padding:9px 0 3px;letter-spacing:.03em}
.step{display:grid;grid-template-columns:24px 74px 1fr auto;gap:0 8px;align-items:center;padding:5px 6px;border-bottom:1px solid var(--hair);cursor:pointer;border-radius:3px}
.step:hover{background:var(--hair)}
.step.cur{background:var(--sel-bg);box-shadow:inset 0 0 0 1.5px var(--sel)}
.step .n{color:var(--soft);font-size:13.5px;text-align:right}
.tag{font-size:12.5px;font-weight:500;padding:1px 7px;border-radius:3px;text-align:center}
.f-read{background:var(--read);color:var(--read-t)}.f-reshape{background:var(--reshape);color:var(--reshape-t)}.f-combine{background:var(--combine);color:var(--combine-t)}.f-reduce{background:var(--reduce);color:var(--reduce-t)}
.step .mark{font-size:12.5px;font-weight:600;white-space:nowrap}
.mark.flag{color:var(--flag)}.mark.warn{color:var(--amber)}
.legend{display:flex;flex-wrap:wrap;gap:5px 10px;margin:10px 0 0;align-items:center;font-size:13px;color:var(--soft)}
.empty{width:560px;color:var(--soft)}.empty h3{font-size:15px;color:var(--ink);margin:0 0 6px;font-weight:600}
.empty ol{margin:8px 0 0;padding-left:22px}.empty li{padding:4px 0;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--hair)}.empty li:hover{color:var(--sel)}
.dm{columns:3 165px;column-gap:14px;width:540px}
.tb{break-inside:avoid;margin-bottom:12px}
.tb>h4{font-size:12.5px;font-weight:600;margin:0;padding:2px 6px;border-bottom:1.5px solid var(--ink);cursor:pointer;font-family:"JetBrains Mono",monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl{font-family:"JetBrains Mono",monospace;font-size:12px;padding:1.5px 6px;cursor:pointer;border-bottom:1px solid var(--hair);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl:hover{background:var(--hair)}
.tb.dim{opacity:.38}.cl.used{background:var(--sel-bg);font-weight:500}.cl.picked{box-shadow:inset 0 0 0 1.5px var(--sel)}
/* B: state */
#strip{display:flex;align-items:stretch;gap:4px;padding:12px 24px;overflow-x:auto;position:sticky;top:0;background:var(--paper);z-index:3;border-bottom:1px solid var(--hair)}
.sc{flex:1 0 92px;max-width:150px;text-align:left;font-size:12.5px;line-height:1.25;padding:5px 7px 6px;border-radius:4px;border:1.5px solid transparent;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.sc:hover{border-color:var(--ink)}.sc.cur{border-color:var(--sel);box-shadow:0 0 0 1.5px var(--sel)}
.sctop{display:flex;align-items:center;gap:5px;font-weight:600}.sctx{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fol{margin-left:auto;font-size:11px;color:var(--sel)}.tocsep{flex:0 0 1px;background:var(--rule);margin:0 6px}
.fdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--flag);vertical-align:baseline}
.followbar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:10px 24px;border-bottom:1px solid var(--rule)}
.frame{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0 20px;align-items:start;margin-top:12px}
.frame h3{font-size:13px;color:var(--soft);font-weight:500;margin:0 0 8px}
.v{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:5px 6px;border-bottom:1px solid var(--hair);cursor:pointer;border-radius:3px}
.v:hover{background:var(--hair)}.v.on{background:var(--sel-bg);box-shadow:inset 0 0 0 1.5px var(--sel)}
.v .nm{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:500}.v .sz{color:var(--soft);font-size:13px}
.v .ty{grid-column:1/3;color:var(--soft);font-size:12.5px}.v .new{color:var(--sel);font-size:12px;font-weight:600;margin-left:6px}
.later{color:var(--soft);font-size:13px;padding:8px 6px}
.steptitle{font-size:18px;font-weight:600;margin:0 0 2px;letter-spacing:-.005em}
.stepat{color:var(--soft);font-size:13px;margin-bottom:12px}
.viewtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.viewtabs span{color:var(--soft);font-size:13px}
.tt{border-collapse:collapse;width:100%;font-size:14px}
.tt th{font-size:12.5px;font-weight:500;color:var(--soft);text-align:left;padding:3px 10px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
.tt td{padding:3.5px 10px;border-bottom:1px solid var(--hair)}.tt td.num,.tt th.num{text-align:right}
.tt tr.flag td{background:var(--flag-bg)}.tt tr.hl td{box-shadow:inset 0 1.5px 0 var(--sel),inset 0 -1.5px 0 var(--sel);font-weight:600}
.tt tr.dim td{opacity:.4}
.rec{display:grid;grid-template-columns:max-content 1fr;gap:3px 16px;font-size:14.5px;max-width:520px}.rec dt{color:var(--soft)}.rec dd{margin:0;font-family:"JetBrains Mono",monospace;font-size:13.5px}
.barrow{display:grid;grid-template-columns:130px 1fr 70px 96px;gap:8px;align-items:center;padding:2.5px 0;font-size:14px}
.barrow .tr{height:18px;background:var(--hair);position:relative}.barrow .fl{height:100%;background:var(--bar);transition:background-color .1s}
.barrow.pass .fl{background:var(--flag)}.barrow.pass{font-weight:600}.barrow .rv{text-align:right}.barrow .a2{color:var(--soft);text-align:right;font-size:13px}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 10px;font-size:14px}
select,input[type=range]{accent-color:var(--sel)}select{font:inherit;font-size:14px;padding:2px 6px;background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:4px}
.read{margin-top:10px;font-size:14.5px}
.gridv{border-collapse:collapse;font-size:14px}.gridv th{font-weight:500;font-size:13px;color:var(--soft);padding:3px 8px;text-align:center}.gridv th.r{text-align:right;color:var(--ink);font-size:14px}
.gridv td.c{width:66px;height:27px;text-align:center;border:2px solid var(--sheet);background:var(--hair);cursor:pointer;font-size:13.5px}.gridv td.c.ok{background:var(--read);color:var(--read-t)}.gridv td.c.warn{background:var(--amber-bg);color:var(--amber)}.gridv td.c.bad{background:var(--flag-bg);color:var(--flag);font-weight:600}
.gridv td.c.pk{outline:2px solid var(--sel)}.gridv td.m{padding-left:8px}.gridv td.m div{height:12px;background:var(--bar)}
.diffr{display:grid;grid-template-columns:1fr 26px 1fr auto;gap:8px;font-family:"JetBrains Mono",monospace;font-size:13.5px;padding:3px 6px;border-bottom:1px solid var(--hair);align-items:center}
.diffr .k{font-family:"Instrument Sans",sans-serif;font-size:13px;color:var(--soft)}.diffr.drop{background:var(--flag-bg)}.diffr.drop .k{color:var(--flag);font-weight:600}.diffr .ar{color:var(--soft);text-align:center}
details.tn{margin-left:14px;font-size:14px}details.tn>summary{cursor:pointer;font-family:"JetBrains Mono",monospace;font-size:13.5px;padding:1.5px 0}.lf{margin-left:14px;font-family:"JetBrains Mono",monospace;font-size:13.5px;padding:1.5px 0}.lf.flag{color:var(--flag)}.lf span{color:var(--soft)}
svg.vz{display:block;max-width:100%}svg.vz text{fill:var(--ink);font:13px "Instrument Sans",sans-serif}svg.vz text.m{fill:var(--soft)}
.side p{margin:0 0 10px}.side .lost{color:var(--flag);font-weight:600}.side .ent{border-top:1px solid var(--rule);padding-top:10px;margin-top:12px}
.side .kbd{color:var(--soft);font-size:13px;margin-top:14px}
/* C: decision */
#decision{padding:16px 24px 28px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0 32px;max-width:1500px}
#decision .q{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0 0 8px;grid-column:1/3}
.rec-line{margin:0 0 12px;max-width:62ch}.rec-line b{color:var(--sel)}
.acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center}.acts button{padding:5px 12px}.acts button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.receipt{margin-top:10px;color:var(--soft)}
.nod{padding:16px 24px 24px;color:var(--soft)}.nod a{color:var(--sel);cursor:pointer;text-decoration:underline;margin-right:10px}
.tiernote{color:var(--amber);font-weight:500}
.bw{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0 28px;margin-top:10px}.bw h3{font-size:13px;color:var(--soft);font-weight:500;margin:0 0 6px}
.wr{display:grid;grid-template-columns:26px 150px 58px 62px minmax(0,1fr);gap:0 8px;align-items:center;height:29px;padding:0 6px;border-bottom:1px solid var(--hair);font-size:13.5px;cursor:pointer;border-radius:2px}.wr:hover{background:var(--hair)}
.wr .nm{font-family:"JetBrains Mono",monospace;font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis}.wr .k{font-size:12px;color:var(--soft)}.wr .sz{color:var(--soft);text-align:right;font-size:13px}.wr .smp{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wr .n{color:var(--soft);font-size:12.5px;text-align:right}
.wr.fut{cursor:default}.wr.fut:hover{background:none}.wr.fut .nm,.wr.fut .n{color:var(--rule)}.wr.new{background:var(--sel-bg);box-shadow:inset 0 0 0 1.5px var(--sel)}.wr.new .smp{color:var(--ink)}.wr.tr{background:var(--sel-bg)}.wr.sel .nm{text-decoration:underline}
.wdet{margin-top:8px;min-height:72px;font-size:13.5px}.wdet pre{margin:3px 0 0;font:12.5px "JetBrains Mono",monospace;white-space:pre-wrap;color:var(--soft)}
.pf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;height:27px;padding:0 6px;border-bottom:1px solid var(--hair);font-family:"JetBrains Mono",monospace;font-size:12.5px;border-radius:2px}.pf.gr{color:var(--soft)}.pf.leaf{cursor:pointer}.pf.leaf:hover{background:var(--hair)}.pf .v{font-weight:500}.pf.wait .v{color:transparent}.pf.work .v{color:var(--soft);font-weight:400}.pf.done .v{color:var(--ink)}.pf.fresh{background:var(--sel-bg)}.pf.pk{box-shadow:inset 0 0 0 1.5px var(--sel)}
.pfl{font:500 12.5px "Instrument Sans",sans-serif;color:var(--soft);padding:10px 0 3px}.trace{margin-top:10px;min-height:92px;font-size:14px}.trace ol{margin:4px 0 0;padding-left:20px}.trace li{padding:1px 0;cursor:pointer}.trace li:hover{color:var(--sel)}.trace .m{color:var(--soft)}
.sc.tr{box-shadow:0 0 0 2px var(--sel)}.sc.off2{opacity:.22}.step.tr{background:var(--sel-bg)}.step.off2{opacity:.4}.pf.off2{opacity:.25}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 10px;padding:7px 10px;background:var(--sel-bg);border:1.5px solid var(--sel);border-radius:4px}.fbar b{font-family:"JetBrains Mono",monospace;font-size:13px}.fbar button{padding:1px 9px;font-size:13px}.fbar .sp{flex:1}
.wrow{border-bottom:1px solid var(--hair)}.wrow .wr{border-bottom:0}.car2{color:var(--soft);display:inline-block;width:12px}
.insp{padding:6px 8px 12px 32px}.insp .why2{margin:0 0 6px;font-size:14px}.insp .calc{color:var(--sel);font-weight:600}.insp input{font:inherit;font-size:13px;padding:2px 8px;width:190px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);color:var(--ink);margin-bottom:5px}.insp .cnt{color:var(--soft);font-size:12.5px;margin-left:8px}
.insp table{border-collapse:collapse;font-size:13px}.insp th{font-size:12.5px;font-weight:500;color:var(--soft);text-align:left;padding:2px 9px;border-bottom:1.5px solid var(--ink);cursor:pointer;white-space:nowrap}.insp th:hover{color:var(--ink)}.insp th.foc{color:var(--sel);font-weight:700}.insp td{padding:2px 9px;border-bottom:1px solid var(--hair);white-space:nowrap}.insp td.foc{background:var(--sel-bg);font-weight:600}.insp tr.row-flag td{color:var(--flag)}.evid{padding:0 24px 22px}.evid h3{font-size:13px;color:var(--soft);font-weight:500;margin:0 0 8px}
#strip:empty{display:none}#strip{border-bottom:2px solid var(--ink);z-index:4}
.at{columns:2 220px;column-gap:16px;min-width:470px}.atb{break-inside:avoid;margin-bottom:2px}
.atn{display:grid;grid-template-columns:14px 1fr;gap:4px;font:12.5px "JetBrains Mono",monospace;padding:3px 5px;cursor:pointer;border-bottom:1px solid var(--hair);white-space:nowrap;border-radius:2px}.atn:hover{background:var(--hair)}.atn span:last-child{overflow:hidden;text-overflow:ellipsis}.atn .car{color:var(--soft)}
.atb.lit>.atn{background:var(--sel-bg);font-weight:600}.atb.dim{opacity:.45}.acl{margin-left:18px}
.lanehd{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:13px;color:var(--soft)}.lanehd button{font-size:12.5px;padding:1px 8px}
#wires{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:5}
.tier:last-child{border-bottom:0}.q{display:grid;grid-template-columns:590px 300px minmax(0,1fr);min-width:1830px}.q>div{padding:14px 20px;min-width:0}.q>div+div{border-left:1px solid var(--rule)}
.st{display:grid;grid-template-columns:62px 1fr;gap:0 8px;align-items:start;padding:7px 6px;border-radius:3px;border-bottom:1px solid var(--hair);cursor:pointer}.st:hover{background:var(--hair)}.st.cur{background:var(--sel-bg);box-shadow:inset 0 0 0 1.5px var(--sel)}.st.lin{background:var(--sel-bg)}
.pad{padding:14px 24px}.one{padding:12px 24px;color:var(--soft)}

.step.stage{grid-template-columns:32px 58px 1fr;margin-left:20px;padding:4px 6px;font-size:14px}.step.stage .n{font-size:12.5px}.step.lin{background:var(--sel-bg)}
.stagehead{margin-left:26px;font-size:12.5px;color:var(--soft);padding:5px 0 2px}
.fnote{margin:0 0 8px;max-width:88ch}.fnote .why{color:var(--flag);font-weight:600}
.followbar{padding:0 0 10px;border-bottom:1px solid var(--rule)}
.tt.pg{table-layout:fixed;width:892px}.tt.pg td{height:28px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tt.pg th{padding:3px 8px;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}.tt.pg th.off{color:var(--rule);border-bottom-color:var(--rule)}.tt.pg th.new{color:var(--sel);font-weight:700}.tt.pg td.new{background:var(--sel-bg)}.tt.pg .lin{box-shadow:inset 2px 0 0 var(--sel),inset -2px 0 0 var(--sel)}
.tt.pg tr.drop td{background:var(--flag-bg);text-decoration:line-through;text-decoration-color:var(--flag)}.tt.pg tr.twice td{font-weight:600}.tt.res{width:400px}
.subh{margin:14px 0 5px;font-size:13px;color:var(--soft)}.outs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}.outs button{font:12.5px "JetBrains Mono",monospace}.chain{margin:4px 0 0;padding:0;list-style:none;min-height:6.5em}.chain li{padding:2px 0 2px 18px;position:relative}.chain li::before{content:"↓";position:absolute;left:2px;color:var(--soft)}.chain li:first-child::before{content:"•"}


.gr-wrap{overflow-x:auto;max-width:100%}.gt{border-collapse:collapse;font-size:13px}.gt th{font-size:12.5px;font-weight:500;text-align:left;padding:3px 9px;border-bottom:1.5px solid var(--ink);white-space:nowrap}.gt th.off{color:var(--rule);border-bottom-color:var(--rule)}.gt td{height:27px;padding:0 9px;border-bottom:1px solid var(--hair);white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}.gt tr.drop td{background:var(--flag-bg);text-decoration:line-through;text-decoration-color:var(--flag)}
